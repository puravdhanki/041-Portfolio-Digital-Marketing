<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #09090b; }
    .mark { fill: #ffffff; }
    .dot  { fill: #34d3b4; stroke: #09090b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .mark { fill: #09090b; }
      .dot  { fill: #0d7a68; stroke: #fafafa; }
    }
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="15"/>
  <text class="mark" x="30" y="42.5" text-anchor="middle"
        font-family="Geist, 'Segoe UI', Inter, Arial, sans-serif"
        font-size="29" font-weight="700" letter-spacing="-1.5">PD</text>
  <circle class="dot" cx="51" cy="13" r="7" stroke-width="3"/>
</svg>
